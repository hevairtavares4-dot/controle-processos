================================================================================
 CONTROLE DE PROCESSOS — arquivo único para publicar na Vercel com Firebase
================================================================================

 COMO PUBLICAR (resumo)
 1. Firebase (https://console.firebase.google.com)
    a) Crie um projeto. Em Visão geral, clique no ícone </> (app da Web) e copie
       os dados do "firebaseConfig" para o bloco FIREBASE_CONFIG logo abaixo.
    b) Authentication > Método de login: ative E-mail/senha (e Google, se quiser).
    c) Firestore Database > Criar banco de dados > região southamerica-east1
       (São Paulo) > modo de produção. Na aba Regras, cole as REGRAS DO FIRESTORE
       que estão no fim deste comentário e clique em Publicar.
    d) Anexos:
       - usarStorage: false  -> anexos de até 20 MB no próprio banco (grátis).
       - usarStorage: true   -> anexos de até 100 MB no Firebase Storage. Exige o
         plano Blaze (pede cartão; tem cota gratuita). Em Storage > Regras, cole
         as REGRAS DO STORAGE do fim deste comentário. Se o Firebase pedir para
         o Storage consultar o Firestore, clique em Permitir.
 2. Vercel (https://vercel.com)
    - Crie um repositório no GitHub, envie este arquivo com o nome index.html
      (Add file > Upload files) e importe o repositório na Vercel
      (Add New > Project > Framework: Other > Deploy).
    - Ou, com Node.js instalado, numa pasta só com este arquivo: npx vercel@latest --prod
 3. De volta ao Firebase: Authentication > Configurações > Domínios autorizados >
    adicione o endereço do site (ex.: controle-processos.vercel.app).
 4. Abra o site e entre com o e-mail do ADMINISTRADOR PRINCIPAL (definido em
    "administradores", logo abaixo). Com o Google, o e-mail já vem confirmado; com
    e-mail e senha, o sistema pede para confirmar o e-mail por um link.
    Depois clique em "Configurar o sistema": os processos de agosto são importados.
    Só o administrador principal pode fazer essa configuração. Os demais criam
    conta e ficam aguardando; o administrador libera em "Equipe".

 Os dados do FIREBASE_CONFIG não são secretos: quem protege o sistema são as regras.

--------------------------------------------------------------------------------
 REGRAS DO FIRESTORE (copie a partir de "rules_version" até a última chave)
--------------------------------------------------------------------------------
rules_version = '2';
// Regras de segurança do Controle de Processos (Firestore).
// Perfis: admin, operador, consulta. Quem cria conta fica sem acesso até um administrador liberar.
// O que Operador e Consulta podem fazer é definido pelo administrador em Configurações > Permissões.
// ADMINISTRADOR PRINCIPAL: o e-mail abaixo tem poder total, sempre, e só ele pode configurar o sistema.
// Para trocar ou incluir outro, edite a lista (em minúsculas) e publique as regras de novo.
service cloud.firestore {
  match /databases/{database}/documents {
    function administradores() { return ['hevairtavares4@gmail.com']; }
    function logado() { return request.auth != null; }
    function adminFixo() {
      return logado() && request.auth.token.get('email_verified', false) == true
        && string(request.auth.token.get('email', '')).lower() in administradores();
    }
    function docPerfil() { return /databases/$(database)/documents/perfis/$(request.auth.uid); }
    function docSistema() { return /databases/$(database)/documents/config/sistema; }
    function docGeral() { return /databases/$(database)/documents/config/geral; }
    function perfilAntes() { return exists(docPerfil()) ? get(docPerfil()).data.perfil : ''; }
    function ehDono() { return exists(docSistema()) && get(docSistema()).data.dono == request.auth.uid; }
    function admin() { return adminFixo() || (logado() && (perfilAntes() == 'admin' || ehDono())); }
    function podeLer() { return admin() || (logado() && perfilAntes() in ['operador', 'consulta']); }

    // Permissões configuráveis. Padrão: Operador pode tudo; Consulta só gera relatórios.
    function permPadrao(p, acao) { return p == 'operador' || acao == 'relatorios'; }
    function permDe(p, acao) {
      return exists(docGeral())
        ? get(docGeral()).data.get('permissoes', {}).get(p, {}).get(acao, permPadrao(p, acao)) == true
        : permPadrao(p, acao);
    }
    function pode(acao) { return admin() || (logado() && perfilAntes() in ['operador', 'consulta'] && permDe(perfilAntes(), acao)); }
    function cadastroAberto() { return !exists(docGeral()) || get(docGeral()).data.get('cadastroAberto', true) != false; }

    function meuResponsavel(id) {
      return exists(/databases/$(database)/documents/acessos/$(request.auth.uid))
        && get(/databases/$(database)/documents/acessos/$(request.auth.uid)).data.responsavel == id;
    }

    // Nome do órgão, brasão, permissões e cadastros: só o administrador altera.
    match /config/geral {
      allow read: if true;
      allow write: if admin();
    }

    // Só o administrador principal faz a configuração inicial.
    match /config/sistema {
      allow read: if logado();
      allow create: if adminFixo() && request.resource.data.dono == request.auth.uid;
      allow update, delete: if false;
    }

    // Perfis: só o administrador muda (nunca o próprio).
    match /perfis/{uid} {
      allow read: if logado();
      allow write: if admin() && uid != request.auth.uid;
      allow create, update: if adminFixo() && uid == request.auth.uid
        && request.resource.data.perfil == 'admin';
    }

    // Liga a conta de login a um nome da equipe.
    match /acessos/{uid} {
      allow read: if logado();
      allow create: if logado() && uid == request.auth.uid && (adminFixo() || cadastroAberto())
        && request.resource.data.keys().hasOnly(['responsavel', 'em', 'email', 'nome']);
      // A própria pessoa só troca o vínculo enquanto ainda não foi liberada.
      allow update: if admin() || (logado() && uid == request.auth.uid && perfilAntes() in ['', 'pendente'] && cadastroAberto()
        && request.resource.data.keys().hasOnly(['responsavel', 'em', 'email', 'nome']));
      allow delete: if admin();
    }

    match /responsaveis/{id} {
      allow read: if logado();
      allow create: if admin() || (logado() && cadastroAberto() && request.resource.data.ativo == true
        && request.resource.data.keys().hasOnly(['nome', 'setor', 'cor', 'ativo']));
      allow update: if admin() || (pode('editar') && meuResponsavel(id));
      allow delete: if admin();
    }

    match /processos/{id} {
      function mudou() { return request.resource.data.diff(resource.data).affectedKeys(); }
      function excluindo() { return !('excluido' in resource.data) && ('excluido' in request.resource.data); }
      function restaurando() { return ('excluido' in resource.data) && !('excluido' in request.resource.data); }
      allow read: if podeLer();
      allow create: if pode('criar');
      allow update: if admin()
        || (excluindo() && mudou().hasOnly(['excluido', 'historico']) && pode('excluir'))
        || (restaurando() && mudou().hasOnly(['excluido', 'historico']) && pode('restaurar'))
        || (mudou().hasOnly(['anexos', 'historico']) && pode('anexar'))
        || (!mudou().hasAny(['anexos', 'excluido']) && pode('editar'));
      allow delete: if admin();
    }

    // Anexos guardados no Firestore (quando o Storage não está ativado).
    match /arquivos/{id} {
      allow read: if podeLer();
      allow create, update, delete: if pode('anexar');
    }
  }
}

--------------------------------------------------------------------------------
 REGRAS DO STORAGE (só se usar usarStorage: true)
--------------------------------------------------------------------------------
rules_version = '2';
// Regras do Firebase Storage para os anexos (só usadas com usarStorage: true).
service firebase.storage {
  match /b/{bucket}/o {
    function adminFixo() {
      return request.auth != null && request.auth.token.get('email_verified', false) == true
        && string(request.auth.token.get('email', '')).lower() in ['hevairtavares4@gmail.com'];
    }
    function perfil() {
      return firestore.exists(/databases/(default)/documents/perfis/$(request.auth.uid))
        ? firestore.get(/databases/(default)/documents/perfis/$(request.auth.uid)).data.perfil : '';
    }
    function podeAnexar() {
      return adminFixo() || perfil() == 'admin' || (perfil() in ['operador', 'consulta']
        && (firestore.exists(/databases/(default)/documents/config/geral)
          ? firestore.get(/databases/(default)/documents/config/geral).data.get('permissoes', {}).get(perfil(), {}).get('anexar', perfil() == 'operador') == true
          : perfil() == 'operador'));
    }
    match /anexos/{id}/{nome} {
      allow read: if request.auth != null && (adminFixo() || perfil() in ['admin', 'operador', 'consulta']);
      allow create: if request.auth != null && podeAnexar() && request.resource.size < 100 * 1024 * 1024;
      allow delete: if request.auth != null && podeAnexar();
    }
  }
}

<script type="module">
// Ponte entre o sistema e o Firebase (Auth, Firestore e Storage). Não precisa editar.
const V = "10.12.2";
const base = `https://www.gstatic.com/firebasejs/${V}/`;
try {
  const cfg = window.FIREBASE_CONFIG;
  const { initializeApp } = await import(base + "firebase-app.js");
  const A = await import(base + "firebase-auth.js");
  const F = await import(base + "firebase-firestore.js");
  const app = initializeApp(cfg.firebase);
  const auth = A.getAuth(app);
  auth.languageCode = "pt";
  await A.setPersistence(auth, A.browserLocalPersistence);
  const fs = F.initializeFirestore(app, { ignoreUndefinedProperties: true });
  const erro = (e) => ({ code: e && e.code === "permission-denied" ? "invalid_argument" : (e && e.code) || "unavailable", message: (e && e.message) || String(e) });
  const ref = (p) => F.doc(fs, ...p.split("/"));
  const db = {
    collection: (col) => ({
      onSnapshot: (next, onErr) => F.onSnapshot(F.collection(fs, col),
        (s) => next({ docs: s.docs.map((d) => ({ id: d.id, exists: true, data: () => d.data() })) }),
        (e) => onErr && onErr(erro(e)))
    }),
    doc: (p) => ({
      set: async (d) => { try { await F.setDoc(ref(p), d); } catch (e) { throw erro(e); } },
      delete: async () => { try { await F.deleteDoc(ref(p)); } catch (e) { throw erro(e); } },
      get: async () => { try { const s = await F.getDoc(ref(p)); return { exists: s.exists(), data: () => s.data() }; } catch (e) { throw erro(e); } },
      onSnapshot: (next, onErr) => F.onSnapshot(ref(p), (s) => next({ exists: s.exists(), data: () => s.data() }), (e) => onErr && onErr(erro(e)))
    }),
    batch: async (ops) => { const b = F.writeBatch(fs); ops.forEach((o) => b.set(ref(o.path), o.data)); try { await b.commit(); } catch (e) { throw erro(e); } }
  };
  let storage = null;
  if (cfg.usarStorage) {
    const ST = await import(base + "firebase-storage.js");
    const st = ST.getStorage(app);
    storage = {
      upload: (path, file, meta, prog) => new Promise((ok, no) => {
        const t = ST.uploadBytesResumable(ST.ref(st, path), file, meta);
        t.on("state_changed", (s) => prog && prog(s.bytesTransferred, s.totalBytes), (e) => no(e), () => ok());
      }),
      url: (path) => ST.getDownloadURL(ST.ref(st, path)),
      del: (path) => ST.deleteObject(ST.ref(st, path)).catch(() => {})
    };
  }
  window.FB = {
    db, storage,
    auth: {
      onChange: (cb) => A.onAuthStateChanged(auth, cb),
      entrar: (email, senha) => A.signInWithEmailAndPassword(auth, email, senha),
      criar: async (email, senha, nome) => { const c = await A.createUserWithEmailAndPassword(auth, email, senha); if (nome) await A.updateProfile(c.user, { displayName: nome }); return c; },
      google: () => A.signInWithPopup(auth, new A.GoogleAuthProvider()),
      reset: (email) => A.sendPasswordResetEmail(auth, email),
      verificar: () => A.sendEmailVerification(auth.currentUser),
      recarregar: async () => { const u = auth.currentUser; if (!u) return false; await A.reload(u); await u.getIdToken(true); return !!u.emailVerified; },
      sair: () => A.signOut(auth)
    }
  };
  window.dispatchEvent(new Event("fb-pronto"));
} catch (e) {
  console.error(e);
  window.dispatchEvent(new CustomEvent("fb-erro", { detail: new Error("Não foi possível iniciar o Firebase: " + ((e && e.message) || e)) }));
}

</script>

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus{outline:none}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.side{background:var(--side);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:20}

.nav{flex:1}
.nav-sep{display:block;height:1px;margin:6px 18px;background:rgba(255,255,255,.12)}
.nav-sep.fim{margin-top:auto}
.nav svg{width:23px;height:23px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);box-shadow:0 1px 0 var(--line);height:58px;display:flex;align-items:center;gap:14px;padding-inline:20px}
.hello{min-width:0;flex:1}
.hello b{display:block;font-size:14px}
.hello small{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{flex:1;max-width:440px;display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:40px}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:0 14px;outline:none}
.search button{border:0;background:var(--accent);color:#fff;width:46px;display:grid;place-items:center;cursor:pointer}
.search button svg{width:18px;height:18px}
.theme-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:12px;font-weight:500}
.theme-btn .knob{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.theme-btn svg{width:14px;height:14px}

.content{padding-block:22px 40px;padding-inline:24px;display:flex;flex-direction:column;gap:18px;max-width:1500px;width:100%}
.page-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.page-head .ttl{display:flex;align-items:center;gap:10px}
.page-head .ico{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 3px 10px color-mix(in srgb,var(--accent) 35%,transparent)}
.page-head .ico svg{width:21px;height:21px}
.page-head h1{font-size:27px;font-weight:700;letter-spacing:-.01em}
.page-head p{margin:2px 0 0;color:var(--muted)}
.page-head .spacer{flex:1}
.ph-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* seletor de mês */
.monthbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.mb-arrow{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--soft);cursor:pointer;display:grid;place-items:center}
.mb-arrow:hover{border-color:var(--accent);color:var(--accent)}
.mb-arrow svg{width:18px;height:18px}
.mb-title{font-size:20px;font-weight:700;min-width:190px;text-align:center}
.mb-months{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.mb-m{border:1px solid transparent;background:none;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12.5px;color:var(--muted);position:relative;font-weight:500;text-transform:capitalize}
.mb-m:hover{background:var(--soft);color:var(--ink)}
.mb-m.has{color:var(--ink)}
.mb-m.has::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mb-m.on{background:var(--accent);color:#fff}
.mb-m.on::after{background:#fff}
.mb-year{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--card)}

.grid{display:grid;gap:18px;grid-template-columns:repeat(12,minmax(0,1fr))}
.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-12{grid-column:span 12}
@media (max-width:1100px){.span-4,.span-5,.span-6,.span-7,.span-8{grid-column:span 12}}
.card{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:16px;font-weight:700;flex:1;min-width:0}
.card-h .badge-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent);color:var(--c,var(--accent));flex:none}
.card-h .badge-ico svg{width:19px;height:19px}
.card-b{padding:14px 18px;min-width:0}
.count{background:var(--soft);border:1px solid var(--line);border-radius:999px;font-size:12px;font-weight:700;padding:1px 9px;font-variant-numeric:tabular-nums}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--k,var(--side))}
.kpi:hover{border-color:var(--k,var(--accent))}
.kpi.on{box-shadow:0 0 0 2px var(--k,var(--accent))}
.kpi b{font-size:28px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--k,var(--ink))}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi small{font-size:11.5px;color:var(--muted)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid color-mix(in srgb,var(--ink) 75%,transparent);background:transparent;color:var(--ink);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.02em;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent);padding:9px 16px;font-size:13px}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:var(--line);text-transform:none;font-weight:500;letter-spacing:0}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--info);cursor:pointer;padding:0;font-weight:500}
.linkbtn:hover{text-decoration:underline}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-andamento{background:var(--info-bg);color:var(--info)}
.s-aguardando{background:var(--warn-bg);color:var(--warn)}
.s-concluido{background:var(--ok-bg);color:var(--ok)}
.s-cancelado{background:var(--gray-bg);color:var(--gray)}

/* barras por responsável */
.rbars{display:flex;flex-direction:column;gap:4px}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;background:none;border:0;padding:8px;margin:0 -8px;border-radius:8px;text-align:left;cursor:pointer;color:inherit}
.rbar:hover,.rbar.on{background:var(--soft)}
.rbar .nm{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500}
.rbar .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .ct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}.rbar .ct b{color:var(--ink)}
.rbar .bar{grid-column:1/-1;display:flex;gap:2px;height:10px}
.rbar .bar span{border-radius:3px;display:block;height:100%}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.legend{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* tabela */
.tbl-wrap{overflow-x:auto;position:relative}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--soft);padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
td .sub{display:block;font-size:12px;color:var(--muted)}
td .sub.obj{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:1;overflow:hidden;text-overflow:ellipsis;word-break:break-word;max-width:520px;margin-top:2px;line-height:1.4}
td.td-int{min-width:260px}
@media (max-width:1500px){.mes-side,.mes-tab{grid-column:span 12}}
@media (max-width:760px){td .sub.obj{-webkit-line-clamp:2;max-width:none}td.td-int{min-width:0}.ptag{white-space:normal;max-width:100%}}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.nproc{font-family:var(--f-mono);font-weight:500;font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.inl{border:1px solid transparent;background:transparent;border-radius:8px;padding:5px 8px;max-width:220px;cursor:pointer}
.inl:hover{border-color:var(--line);background:var(--card)}
.inl.vazio{color:var(--warn);font-weight:500;border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-bg)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.filters input[type=text]{flex:1;min-width:180px}
select,input[type=text],input[type=date],input[type=number],textarea,input[type=color]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:70px}
.empty{color:var(--muted);text-align:center;padding:30px 12px}
.av{width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.person{display:flex;align-items:center;gap:10px;min-width:0}

/* histórico */
.matrix td,.matrix th{text-align:center;padding:8px 6px;font-variant-numeric:tabular-nums}
.matrix th:first-child,.matrix td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--card);z-index:1}
.matrix th:first-child{background:var(--soft)}
.matrix th{text-transform:capitalize}
.cell{display:inline-grid;place-items:center;min-width:34px;height:30px;border-radius:7px;font-weight:700;cursor:pointer;border:0;color:var(--ink);background:transparent}
.cell.z{color:var(--muted);font-weight:400;cursor:default}
.cell:not(.z):hover{outline:2px solid var(--accent)}
.matrix tfoot td{font-weight:700;border-top:2px solid var(--line);background:var(--soft)}
.matrix tfoot td:first-child{background:var(--soft)}
.matrix td.tot{font-weight:700}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .lbl{fill:var(--ink);font-weight:700;font-size:11px}
.chart rect.hit{fill:transparent;cursor:pointer}
.chart rect.hit:hover{fill:color-mix(in srgb,var(--accent) 8%,transparent)}

/* responsáveis */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.rcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);text-align:left;cursor:pointer;color:var(--ink)}
.rcard:hover{border-color:var(--accent)}
.rcard.off{opacity:.6}
.rc-top{display:flex;gap:10px;align-items:center}
.rc-top b{font-size:15px;display:block}.rc-top small{color:var(--muted);font-size:12px}
.rc-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rc-nums span{background:var(--soft);border-radius:8px;padding:6px 8px;font-size:11px;color:var(--muted);display:flex;flex-direction:column}
.rc-nums span b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.spark{display:flex;align-items:flex-end;gap:3px;height:34px}
.spark i{flex:1;background:color-mix(in srgb,var(--c) 70%,transparent);border-radius:2px 2px 0 0;min-height:2px}
.spark i.z{background:var(--line)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(6,25,33,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px;overflow:auto}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:760px;box-shadow:0 20px 50px rgba(0,0,0,.3);display:flex;flex-direction:column;min-width:0}
.modal-h{display:flex;align-items:flex-start;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:20px}
.modal-h .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--muted);padding:4px}
.modal-h .x svg{width:22px;height:22px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 14px 14px}
.modal-f .spacer{flex:1}
.form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
.form label > *{color:var(--ink);font-size:14px;font-weight:400}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c6{grid-column:span 6}
.sitpick{display:flex;gap:6px;flex-wrap:wrap}
.sitpick label{flex-direction:row;align-items:center;gap:0;cursor:pointer}
.sitpick input{position:absolute;opacity:0;pointer-events:none}
.sitpick .pill{cursor:pointer;border:1px solid transparent;opacity:.55;padding:6px 12px;font-size:13px}
.sitpick input:checked + .pill{opacity:1;border-color:currentColor}
.sitpick input:focus-visible + .pill{outline:2px solid var(--accent)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-left:2px solid var(--line);margin-left:6px}
.hist li{position:relative;padding:4px 0 10px 16px;font-size:13px}
.hist li::before{content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.hist small{display:block;color:var(--muted);font-size:11.5px}
.confirm{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:13px}
.cfg-wrap{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.cfg-wrap .full{grid-column:1/-1}
.cfg-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.cfg-row:first-child{border-top:0;padding-top:2px}
.cfg-row .cr-t{flex:1;min-width:180px}
.cfg-row .cr-t > b{display:block;font-size:14px}
.cfg-row .cr-t small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.brasao-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brasao-prev{width:76px;height:76px;border-radius:12px;border:1px dashed var(--line);background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}
.brasao-prev img{max-width:100%;max-height:100%;object-fit:contain}
.brasao-prev span{font-size:11px;color:var(--muted);text-align:center;padding:4px}
.sw{position:relative;display:inline-flex;width:44px;height:26px;flex:none;cursor:pointer}
.sw input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw input:checked + i{background:var(--ok)}
.sw input:checked + i::after{transform:translateX(18px)}
.sw input:focus-visible + i{outline:2px solid var(--accent);outline-offset:2px}
.sw input:disabled + i{opacity:.55;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:none;padding:7px 12px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent)}
.cfg-bar{position:sticky;bottom:12px;z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.cfg-bar b{flex:1;min-width:160px;font-size:14px}
.perm td.pc,.perm th.pc{width:108px;text-align:center}
.perm th{text-transform:none!important}
.perm td{vertical-align:middle}
.perm tr.fixo td{color:var(--muted)}
.perm .pm{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%}
.perm .pm svg{width:14px;height:14px}
.perm .pm.sim{background:var(--ok-bg);color:var(--ok)}
.perm .pm.nao{color:var(--muted)}
.perm tr.grp td{background:var(--soft);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding-top:6px;padding-bottom:6px}
.perm .me{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}.perm .me b{display:block}
.cfg-me{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}.cfg-me .av{width:42px;height:42px;font-size:15px}.cfg-me b{display:block;font-size:15px}.cfg-me small{color:var(--muted);font-size:12.5px}
@media (max-width:640px){.perm th.pa,.perm td.pa{display:none}.perm td.pc,.perm th.pc{width:58px;padding-inline:2px}.perm th.pc{font-size:11px}.perm th:first-child,.perm td:first-child{min-width:0!important;padding-left:10px}.perm .sw{transform:scale(.9)}}
.sec-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 12px}
.sec-it{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;min-width:0}
.sec-it span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.sec-it small{font-size:11.5px;white-space:nowrap}
.sec-it .linkbtn:disabled{opacity:.3;cursor:default}
.sec-add{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.sec-add input{flex:1;min-width:200px}
.cfg-mail{display:inline-block;font-size:13px;background:var(--soft);border-radius:8px;padding:3px 8px;margin:2px 4px 2px 0;word-break:break-all}
@media (max-width:900px){.cfg-wrap{grid-template-columns:1fr}}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.note b{color:var(--ink)}
.sec-t{font-size:14px;font-weight:700}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors label{cursor:pointer}
.colors input{position:absolute;opacity:0}
.colors i{display:block;width:28px;height:28px;border-radius:50%;border:3px solid transparent}
.colors input:checked + i{border-color:var(--card);box-shadow:0 0 0 2px var(--ink)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;z-index:80;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:10px;padding:8px 12px;font-size:13px}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner b{color:inherit}
.banner .spacer{flex:1}

/* exclusão */
.ck{width:17px;height:17px;accent-color:var(--accent);vertical-align:-3px;margin:0 6px 0 0;cursor:pointer}
tr.selr td{background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.tdx{width:1%;white-space:nowrap;text-align:right}
.trash{width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}
.trash svg{width:18px;height:18px}
.trash:hover{color:var(--bad);background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.sm svg{width:14px;height:14px}
.rowq{display:inline-flex;align-items:center;gap:6px;color:var(--bad);font-size:13px;font-weight:500;white-space:nowrap;flex-wrap:wrap}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 18px;background:var(--bad-bg);color:var(--bad);border-bottom:1px solid color-mix(in srgb,var(--bad) 25%,transparent)}

function secSugestoes(){ return [...new Set([...secretarias(),...Object.values(S.proc).map(p=>p.secretaria).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt-BR')); }
function secretarias(){ const L=S.config&&Array.isArray(S.config.secretarias)?S.config.secretarias:SEC_PADRAO; return L.filter(x=>typeof x==='string'&&x.trim()); }
function secCurta(n){ return String(n||'').replace(/^Secretaria (Municipal )?(de |da |do |das |dos )?/i,''); }
function prefixoMod(k,forma){ const m=MODK[k]; if(!m||!m.pre) return ''; return typeof m.pre==='string'?m.pre:(m.pre[forma]||m.pre.eletronica); }

const LKEY='controle-processos-local';
function loadLocal(){ try{ const r=localStorage.getItem(LKEY); if(r) return JSON.parse(r); }catch(e){} return JSON.parse(JSON.stringify(SEED||{processos:{},responsaveis:{},config:{}})); }

const KEY={processos:'proc',responsaveis:'resp',acessos:'acessos',perfis:'perfis'};
function cacheSet(col,id,val){ if(col==='config'){ if(val) S.config=val; return; } const k=KEY[col]; if(!k) return; const o={...S[k]}; if(val===undefined) delete o[id]; else o[id]=val; S[k]=o; }
function cacheGet(col,id){ return col==='config'?S.config:(KEY[col]?S[KEY[col]][id]:undefined); }
async function put(col,id,data){
  if(S.mode==='db'){ const antes=cacheGet(col,id); cacheSet(col,id,data);
    try{ await S.db.doc(col+'/'+id).set(data); }catch(e){ cacheSet(col,id,antes); writeErr(e,col); render(); throw e; } }
  else { if(col==='config') S.config=data; else S[KEY[col]]={...S[KEY[col]],[id]:data}; saveLocal(); render(); }
}
async function del(col,id){
  if(S.mode==='db'){ const antes=cacheGet(col,id); cacheSet(col,id,undefined);
    try{ await S.db.doc(col+'/'+id).delete(); }catch(e){ cacheSet(col,id,antes); writeErr(e,col); render(); throw e; } }
  else { const o={...S[KEY[col]]}; delete o[id]; S[KEY[col]]=o; saveLocal(); render(); }
}
function writeErr(e,col){
  if(e&&e.code==='invalid_argument'&&(col==='perfis'||col==='acessos')){ toast('Só quem é Editor no botão Compartilhar pode mudar perfis e vínculos de outras pessoas.'); return; }
  if(e&&e.code==='invalid_argument'&&S.fb){ toast('Sem permissão para essa ação. Fale com o administrador.'); }
  else if(e&&e.code==='invalid_argument'){ S.canWrite=false; toast('Seu acesso é só de consulta. Peça acesso de colaborador para editar.'); render(); }
  else if(e&&e.code==='quota_exceeded') toast('A base atingiu o limite de registros.');
  else toast('Não foi possível salvar agora. Tente de novo em instantes.');
}

  const rows=ids.filter(i=>i!=='_'||m['_'].some(Boolean)).sort((a,b)=>a==='_'?1:b==='_'?-1:respNome(a).localeCompare(respNome(b),'pt-BR'));
  const tot=Array(12).fill(0); L.forEach(p=>tot[+p.data.slice(5,7)-1]++);
  const max=Math.max(1,...rows.flatMap(r=>m[r]));
  const anos=[...new Set([...lista().map(p=>+(p.data||'').slice(0,4)).filter(Boolean),new Date().getFullYear()])].sort();
  const sit={}; SITK.forEach(s=>sit[s]=Array(12).fill(0)); L.forEach(p=>sit[p.situacao||'andamento'][+p.data.slice(5,7)-1]++);
  const rank=rows.filter(r=>r!=='_').map(r=>[r,m[r].reduce((a,b)=>a+b,0)]).sort((a,b)=>b[1]-a[1]);
  return head('historico','<select class="mb-year" id="hYear" aria-label="Ano">'+anos.map(a=>'<option'+(a===Y?' selected':'')+'>'+a+'</option>').join('')+'</select><button class="btn ghost" data-act="pdf-ano">'+I.pdf+'PDF do ano</button><button class="btn ghost" data-act="csv-ano">'+I.down+'CSV</button>')+
  '<div class="grid">'+

  '<section class="card span-8"><div class="card-h"><span class="badge-ico" style="--c:var(--side)">'+I.responsaveis+'</span><h2>Quem fez, mês a mês</h2><span class="muted hint" style="font-size:12px">Clique num número para ver os processos</span></div>'+
    (rows.length?'<div class="tbl-wrap"><table class="matrix"><thead><tr><th>Responsável</th>'+MES3.map(x=>'<th>'+x+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+
      rows.map(r=>'<tr><td><div class="person">'+(r==='_'?avatar(''):avatar(r))+'<span>'+(r==='_'?'Sem responsável':h(respNome(r)))+'</span></div></td>'+m[r].map((n,i)=>'<td>'+(n?'<button class="cell" data-goto="'+Y+'-'+pad(i+1)+'|'+r+'" style="background:color-mix(in srgb,'+(r==='_'?'var(--bad)':h(respCor(r)))+' '+Math.round(12+n/max*48)+'%,transparent)" title="'+(r==='_'?'Sem responsável':h(respNome(r)))+' — '+MESES[i]+': '+n+'">'+n+'</button>':'<span class="cell z">·</span>')+'</td>').join('')+'<td class="tot">'+m[r].reduce((a,b)=>a+b,0)+'</td></tr>').join('')+
      '</tbody><tfoot><tr><td>Total</td>'+tot.map(n=>'<td>'+(n||'·')+'</td>').join('')+'<td>'+L.length+'</td></tr></tfoot></table></div>'
      :'<div class="empty">Nenhum processo em '+Y+'.</div>')+
  '</section>'+

    (rank.length?'<div class="rbars">'+rank.map(([r,n],i)=>{ const c=L.filter(p=>p.responsavel===r&&p.situacao==='concluido').length; return '<button class="rbar" data-act="ver-resp" data-id="'+r+'"><span class="nm"><b class="mono" style="color:var(--muted);width:18px">'+(i+1)+'</b>'+avatar(r)+'<span>'+h(respNome(r))+'</span></span><span class="ct"><b>'+n+'</b> · '+c+' concluído'+(c===1?'':'s')+'</span></button>'; }).join('')+'</div>':'<div class="empty">Sem responsáveis com processos no ano.</div>')+
  '</div></section></div>';

function grafico(sit,tot,Y){
  const W=760,H=240,L=34,R=10,T=16,B=28; const cw=(W-L-R)/12; const bw=Math.min(36,cw*.6);
  const mx=Math.max(1,...tot); const step=mx<=5?1:mx<=10?2:mx<=25?5:mx<=50?10:Math.ceil(mx/5/10)*10; const top=Math.ceil(mx/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);
  let g=''; for(let v=0;v<=top;v+=step) g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>';
  let bars=''; for(let i=0;i<12;i++){ const x=L+i*cw+(cw-bw)/2; let acc=0;
    SITK.forEach(s=>{ const n=sit[s][i]; if(!n) return; const y1=y(acc+n), y0=y(acc); bars+='<rect x="'+x+'" y="'+y1+'" width="'+bw+'" height="'+Math.max(0,y0-y1-(acc+n<tot[i]?1:0))+'" rx="2" style="fill:'+SIT[s].c+'"><title>'+MESES[i]+' — '+SIT[s].l+': '+n+'</title></rect>'; acc+=n; });
    if(tot[i]) bars+='<text class="lbl" x="'+(x+bw/2)+'" y="'+(y(tot[i])-5)+'" text-anchor="middle">'+tot[i]+'</text>';
    bars+='<text x="'+(L+i*cw+cw/2)+'" y="'+(H-9)+'" text-anchor="middle">'+MES3[i]+'</text>';
    bars+='<rect class="hit" x="'+(L+i*cw)+'" y="'+T+'" width="'+cw+'" height="'+(H-T-B)+'" data-goto="'+Y+'-'+pad(i+1)+'|"><title>Ver '+MESES[i]+'</title></rect>'; }
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Processos por mês em '+Y+'">'+g+bars+'</svg>';
}

function lerImagem(file){ return new Promise((ok,no)=>{ const fr=new FileReader(); fr.onerror=()=>no(new Error('leitura')); fr.onload=()=>{ const img=new Image(); img.onload=()=>ok(img); img.onerror=()=>no(new Error('imagem')); img.src=fr.result; }; fr.readAsDataURL(file); }); }
async function prepararBrasao(file){
  if(!file) return; if(file.size>8*1024*1024){ toast('Imagem muito grande. Use uma de até 8 MB.'); return; }
  try{ const img=await lerImagem(file); let lado=256, url='';
    for(let i=0;i<3;i++){ const c=document.createElement('canvas'); c.width=c.height=lado; const g=c.getContext('2d'); const w=img.naturalWidth||img.width||lado, hh=img.naturalHeight||img.height||lado; const k=Math.min(lado/w,lado/hh); g.drawImage(img,(lado-w*k)/2,(lado-hh*k)/2,w*k,hh*k); url=c.toDataURL('image/png'); if(url.length<350000) break; lado=Math.round(lado*0.7); }
    const D=cfgRascunho(); D.brasao=url; D.sujo=true; render(); toast('Brasão carregado. Clique em Salvar alterações.');
  }catch(e){ toast('Não foi possível ler essa imagem. Tente um arquivo PNG ou JPG.'); }
}
function coletarCfg(){ const D=cfgRascunho(); const v=id=>{ const n=document.getElementById(id); return n?n.value:null; }; const o=v('cf_orgao'), st=v('cf_setor'), di=v('cf_dias'); if(o!=null) D.orgao=o; if(st!=null) D.setor=st; if(di!=null) D.diasParado=di; return D; }
async function salvarCfg(){

  const novo={...S.config,orgao:D.orgao.trim(),setor:D.setor.trim(),diasParado:dias}; if(D.brasao) novo.brasao=D.brasao; else delete novo.brasao;
  try{ await put('config','geral',novo); S.cfgDraft=null; if(S.rp) S.rp.dias=dias; render(); toast('Configurações salvas.'); }catch(e){}
}

async function lerBackup(file){
  if(!file) return;
  try{ const d=JSON.parse(await file.text()); if(!d||d.sistema!=='controle-processos'||typeof d.processos!=='object') throw new Error('formato');
    const P={}; Object.entries(d.processos||{}).forEach(([id,p])=>{ if(/^[\w-]{1,80}$/.test(id)&&p&&typeof p==='object') P[id]=p; });
    const Rr={}; Object.entries(d.responsaveis||{}).forEach(([id,r])=>{ if(/^[\w-]{1,80}$/.test(id)&&r&&typeof r==='object'&&r.nome) Rr[id]={nome:String(r.nome),setor:String(r.setor||''),cor:CORES.includes(r.cor)?r.cor:CORES[0],ativo:r.ativo!==false}; });
    S.cfgImport={P,R:Rr,np:Object.keys(P).length,nr:Object.keys(Rr).length,quando:d.geradoEm?agoraTxt(d.geradoEm):'data desconhecida'}; render();
  }catch(e){ toast('Este arquivo não é um backup do Controle de Processos.'); }

async function restaurarBackup(btn){

  const grava=async(col,id,data)=>{ if(S.mode==='db') await S.db.doc(col+'/'+id).set(data); cacheSet(col,id,data); };
  for(const [id,r] of Object.entries(imp.R)){ try{ const existe=!!S.resp[id]; if(S.fb&&!existe&&!r.ativo){ await grava('responsaveis',id,{...r,ativo:true}); } await grava('responsaveis',id,r); ok++; }catch(e){ falhas++; } }

/* ===================== Anexos ===================== */
const ASSET_TYPES={pdf:'application/pdf',png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',webm:'video/webm',csv:'text/csv',txt:'text/plain',md:'text/markdown',json:'application/json'};
const CATS=['Documento completo','Requerimento','Ofício','Documento pessoal','Certidão','Contrato','Nota fiscal','Parecer','Foto','Outro'];
const MAX_ASSET=20*1024*1024, MAX_TOTAL=100*1024*1024; let MAX_DB=10*1024*1024, CHUNK=180000; if(window.FIREBASE_CONFIG){ MAX_DB=20*1024*1024; CHUNK=700000; } const PARTE=14*1024*1024 /* múltiplo de 3: cada parte vira texto base64 < 20 MB */;
const extDe=n=>(String(n).split('.').pop()||'').toLowerCase();
function tamTxt(b){ return b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB'; }
function catSug(n){
  const base=String(n).replace(/\.[^.]+$/,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); const w=base.split(/[^a-z0-9]+/).filter(Boolean); const tem=(...x)=>x.some(v=>w.includes(v)); const pre=(...x)=>x.some(v=>w.some(t=>t.startsWith(v)));
  if(pre('complet','fechament','integra')||/processo\s*complet/.test(base)) return 'Documento completo';
  if(pre('requeriment','requer')) return 'Requerimento'; if(pre('oficio')) return 'Ofício'; if(pre('certidao','certidoes')||tem('cnd','crf','cndt')) return 'Certidão';
  if(pre('contrato','aditivo')) return 'Contrato'; if(tem('nf','nfe','nfse','danfe')||/nota\s*fiscal/.test(base)) return 'Nota fiscal'; if(pre('parecer')) return 'Parecer';
  if(tem('rg','cpf','cnh','cnpj')||pre('identidade')) return 'Documento pessoal'; if(/^(png|jpe?g|gif|webp|heic)$/.test(extDe(n))) return 'Foto'; return 'Outro'; }
function iconeArq(a){ const e=extDe(a.nome); const c=e==='pdf'?'#cc3133':/^(png|jpe?g|gif|webp)$/.test(e)?'#2f8f5b':/^(docx?|odt|rtf)$/.test(e)?'#2b5fb5':/^(xlsx?|ods|csv)$/.test(e)?'#17905f':/^(mp4|webm)$/.test(e)?'#7a4fb5':'#5d6b73';
  return '<span class="fi" style="--fc:'+c+'"><b>'+h((e||'arq').slice(0,4).toUpperCase())+'</b></span>'; }
function idb(){ return new Promise((ok,err)=>{ try{ const r=indexedDB.open('controle-processos-anexos',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>ok(r.result); r.onerror=()=>err(r.error); }catch(e){ err(e); } }); }
async function idbOp(mode,fn){ const d=await idb(); return new Promise((ok,err)=>{ const t=d.transaction('f',mode); const st=t.objectStore('f'); const rq=fn(st); t.oncomplete=()=>ok(rq&&rq.result); t.onerror=()=>err(t.error); }); }
const idbPut=(k,v)=>idbOp('readwrite',s=>s.put(v,k)), idbGet=k=>idbOp('readonly',s=>s.get(k)), idbDel=k=>idbOp('readwrite',s=>s.delete(k));
function paraB64(blob){ return new Promise((ok,err)=>{ const r=new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]||''); r.onerror=()=>err(r.error); r.readAsDataURL(blob); }); }
function deB64(s,type){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:type||'application/octet-stream'}); }
const ERR_UP={too_large:'o arquivo passa de 20 MB',unsupported_type:'tipo de arquivo não aceito',quota_or_state:'o espaço de anexos do sistema está cheio',rate_limited:'muitos envios seguidos; aguarde alguns segundos',upstream_auth:'sua sessão expirou; recarregue a página'};
async function subirAsset(blob,type){
  try{ return await S.assets.upload(blob,{type}); }
  catch(err){ if(err&&(err.code==='store_unavailable'||err.code==='rate_limited')){ await new Promise(r=>setTimeout(r,2500)); try{ return await S.assets.upload(blob,{type}); }catch(e2){ err=e2; } }
    const m=ERR_UP[err&&err.code]||'não foi possível enviar'; const e=new Error(m); e.code=err&&err.code; throw e; }
}
async function enviarArquivo(file,cat,prog){
  const e=extDe(file.name), tipo=ASSET_TYPES[e]; const id=newId('a');
  const base={nome:file.name,tamanho:file.size,mime:tipo||file.type||'application/octet-stream',cat:cat||catSug(file.name),em:new Date().toISOString(),por:porId()};
  if(S.mode!=='db'){ if(file.size>200*1024*1024) throw new Error('o arquivo passa de 200 MB'); await idbPut(id,file); return {...base,id,via:'idb'}; }
  if(file.size>MAX_TOTAL) throw new Error('o arquivo passa de 100 MB; compacte ou divida em partes');
  if(S.fb&&S.fbStorage){ const path='anexos/'+id+'/'+file.name.replace(/[\/#?\[\]*]/g,'_');
    try{ await FB.storage.upload(path,file,{contentType:base.mime,contentDisposition:"attachment; filename*=UTF-8''"+encodeURIComponent(file.name)},(b,t)=>{ if(prog&&t) prog(Math.round(b/t*100),'%'); }); }
    catch(err){ throw new Error(err&&err.code==='storage/unauthorized'?'sem permissão para enviar arquivos':err&&err.code==='storage/quota-exceeded'?'o espaço de arquivos do Firebase acabou':'não foi possível enviar'); }
    return {...base,id,via:'fbs',path}; }
  if(S.fb&&file.size>MAX_DB) throw new Error('sem o Firebase Storage ativado, o limite é '+Math.round(MAX_DB/1048576)+' MB por arquivo');
  if(S.assets){
    if(tipo&&file.size<=MAX_ASSET){ const r=await subirAsset(file,tipo); return {...base,id:r.id,via:'asset'}; }
    /* tipo não aceito direto (ZIP, Word, Excel…) ou maior que 20 MB: envia em partes de texto */
    const n=Math.max(1,Math.ceil(file.size/PARTE)); const ids=[];
    try{ for(let i=0;i<n;i++){ if(prog) prog(i+1,n); const b64=await paraB64(file.slice(i*PARTE,(i+1)*PARTE)); const r=await subirAsset(new Blob([b64],{type:'text/plain'}),'text/plain'); ids.push(r.id); } }
    catch(err){ for(const x of ids) await S.assets.delete(x).catch(()=>{}); throw err; }
    return {...base,id:ids[0],via:'asset64',partes:ids};
  }
  if(file.size>MAX_DB) throw new Error('sem o armazenamento de arquivos nesta visualização, o limite é 10 MB');
  const b64=await paraB64(file); const n=Math.max(1,Math.ceil(b64.length/CHUNK));
  for(let i=0;i<n;i++){ if(prog) prog(i+1,n); await S.db.doc('arquivos/'+id+'_'+i).set({d:b64.slice(i*CHUNK,(i+1)*CHUNK),i,n}); }
  return {...base,id,via:'db',partes:n};
}
async function lerArquivo(a){
  if(a.via==='idb'){ const b=await idbGet(a.id); if(!b) throw new Error('arquivo não encontrado neste navegador'); return b; }
  if(a.via==='asset'){ const r=await fetch('/_blob/'+a.id); if(!r.ok) throw new Error('arquivo indisponível para você'); return await r.blob(); }
  if(a.via==='asset64'){ const partes=[]; for(const pid of a.partes){ const r=await fetch('/_blob/'+pid); if(!r.ok) throw new Error('arquivo indisponível para você'); partes.push(await deB64((await r.text()).trim()).arrayBuffer()); } return new Blob(partes,{type:a.mime}); }
  let s=''; for(let i=0;i<(a.partes||1);i++){ const d=await S.db.doc('arquivos/'+a.id+'_'+i).get(); if(!d.exists) throw new Error('arquivo incompleto'); s+=d.data().d; }
  return deB64(s,a.mime);
}
async function apagarArquivo(a){
  try{ if(a.via==='fbs'){ if(window.FB&&FB.storage) await FB.storage.del(a.path); return; } if(a.via==='idb') await idbDel(a.id); else if(a.via==='asset'){ if(S.assets) await S.assets.delete(a.id).catch(()=>{}); } else if(a.via==='asset64'){ if(S.assets) for(const x of a.partes) await S.assets.delete(x).catch(()=>{}); } else if(a.via==='db'&&S.db){ for(let i=0;i<(a.partes||1);i++) await S.db.doc('arquivos/'+a.id+'_'+i).delete(); } }catch(e){}
}
const podeAnexar=()=>pode('anexar')&&(S.mode!=='db'||!!S.db);

  if(L.length||pend.length||Object.keys(up).length) x+='<div class="anx-l">'+L.map((a,i)=>linha(a,i,false)).join('')+pend.map((a,i)=>linha({nome:a.file.name,tamanho:a.file.size,cat:a.cat},i,true)).join('')+

async function subirParaProcesso(pid,itens){
  const M=S.modal; const novos=[], erros=[];

    const prog=(i,n)=>{ if(M&&M.subindo&&M.subindo[k]&&(n==='%'||n>1)){ M.subindo[k].p=n==='%'?i+'%':'parte '+i+' de '+n; const el=document.querySelector('[data-up="'+k+'"] small'); if(el) el.textContent='Enviando '+M.subindo[k].p+'…'; } };

  const db=S.db; const falta=new Set(['proc','resp','acessos','perfis','config','sistema']); S.subs=[];

      if(key==='perfis'&&S.procNegado&&perfilConta()!=='pendente') assinarProcessos(ready);

  assinarProcessos(ready); sub('responsaveis','resp'); sub('acessos','acessos'); sub('perfis','perfis');
  S.subs.push(db.doc('config/geral').onSnapshot(s=>{ if(s.exists) S.config={orgao:'',setor:'',...s.data()}; ready('config'); },()=>ready('config')));
  S.subs.push(db.doc('config/sistema').onSnapshot(s=>{ S.sistema=s.exists?s.data():null; S.canEditConta=!!(S.sistema&&S.sistema.dono===S.myId)||souAdminFixo(); ready('sistema'); },()=>{ S.sistema=null; ready('sistema'); }));

function coletarProc(){ const M=S.modal; if(!M||M.kind!=='proc') return; const p=M.d;
  ['numero','data','responsavel','interessado','assunto','conclusao','obs','modalidade','forma','numMod','fundamento','contrato','secretaria'].forEach(k=>{ const el=document.getElementById('p_'+k); if(el) p[k]=k==='numero'?(+el.value||''):el.value.trim(); });
  if(p.secretaria){ p.secretaria=p.secretaria.replace(/\s+/g,' ').trim(); const igual=secSugestoes().find(x=>x.toLowerCase()===p.secretaria.toLowerCase()); if(igual) p.secretaria=igual; }
  const m=MODK[p.modalidade]; if(!m||!m.forma) p.forma=''; else if(!document.getElementById('p_forma')&&m.k!=='dispensa'&&!p.forma) p.forma='eletronica';

function coletarResp(){ const M=S.modal; if(!M||M.kind!=='resp') return; const r=M.d;

async function salvarProc(){
  coletarProc(); const M=S.modal, p=M.d;
  if(!(M.id?pode('editar'):pode('criar'))){ negar(); return; }
  if(!p.numero){ toast('Informe o número do processo.'); document.getElementById('p_numero').focus(); return; }
  if(!p.data){ toast('Informe a data.'); document.getElementById('p_data').focus(); return; }
  if(!p.interessado){ toast('Informe o interessado.'); document.getElementById('p_interessado').focus(); return; }
  const dup=lista().find(x=>+x.numero===+p.numero&&x.id!==M.id&&(x.data||'').slice(0,4)===p.data.slice(0,4));
  if(dup && !M.dupOk){ M.dupOk=true; toast('Já existe o processo nº '+p.numero+' em '+p.data.slice(0,4)+'. Clique em Salvar de novo para confirmar.'); return; }
  if(p.situacao!=='concluido'&&p.situacao!=='cancelado') p.conclusao='';
  const old=M.id?S.proc[M.id]:null; const H=[...(p.historico||[])];
  if(!old) H.push(logItem('Processo registrado'+(p.responsavel?' · responsável: '+respNome(p.responsavel):'')+'.'));
  else {
    if((old.responsavel||'')!==(p.responsavel||'')) H.push(logItem('Responsável: '+(respNome(old.responsavel)||'ninguém')+' → '+(respNome(p.responsavel)||'ninguém')+'.'));
    if((old.situacao||'andamento')!==p.situacao) H.push(logItem('Situação: '+SIT[old.situacao||'andamento'].l+' → '+SIT[p.situacao].l+'.'));
    const camp=['numero','data','interessado','assunto','obs','secretaria','modalidade','forma','numMod','fundamento','contrato'].filter(k=>String(old[k]||'')!==String(p[k]||'')); if(camp.length) H.push(logItem('Dados alterados: '+camp.map(k=>({numero:'nº',data:'data',interessado:'interessado',assunto:'assunto',obs:'observações',modalidade:'modalidade',forma:'forma',numMod:'nº da modalidade',fundamento:'fundamento legal',contrato:'nº do contrato',secretaria:'secretaria'}[k])).join(', ')+'.'));
  }
  p.historico=H.slice(-60); const id=M.id||newId('p');
  const pend=M.pend||[];
  try{ await put('processos',id,p);
    if(!old&&pend.length){ S.modal={...M,id,d:{...p},pend:[]}; renderModal(); await subirParaProcesso(id,pend); }
    fechar(); toast(old?'Processo salvo.':'Processo nº '+p.numero+' registrado'+(pend.length?' com anexos':'')+'.'); if(!old && mk(p.data)!==S.mes){ S.mes=mk(p.data); render(); } }catch(e){}
}
async function setCampo(id,campo,val){
  if(!pode('editar')){ negar(); render(); return; }
  const old=S.proc[id]; if(!old||(old[campo]||'')===val) return; const p=JSON.parse(JSON.stringify(old));
  p[campo]=val; if(campo==='situacao'){ p.conclusao=(val==='concluido'||val==='cancelado')?hoje():''; }
  p.historico=[...(p.historico||[]),logItem(campo==='responsavel'?'Responsável: '+(respNome(old.responsavel)||'ninguém')+' → '+(respNome(val)||'ninguém')+'.':'Situação: '+SIT[old.situacao||'andamento'].l+' → '+SIT[val].l+'.')].slice(-60);
  try{ await put('processos',id,p); toast('Processo nº '+p.numero+': '+(campo==='responsavel'?(respNome(val)||'sem responsável'):SIT[val].l.toLowerCase())+'.'); }catch(e){ render(); }
}
async function salvarResp(){

async function resolverNomes(ids){
  if(S.fb){ (ids||[]).forEach(i=>{ const a=S.acessos[i]; if(a) S.names[i]=a.nome||a.email||''; }); return; }
  ids=[...new Set(ids)].filter(i=>i&&!String(i).startsWith('r:')&&!(i in S.names)); if(!ids.length||!S.user||!S.user.profiles) return;
  ids.forEach(i=>S.names[i]='');
  try{ const ps=await S.user.profiles(ids); ids.forEach(i=>S.names[i]=(ps&&ps[i]&&ps[i].name)||''); if(S.modal) redesenharModal(); else if(route()==='lixeira') render(); }catch(e){}
}

function porModalidade(L){ const o={}; L.forEach(p=>{ const k=p.modalidade&&MODK[p.modalidade]?p.modalidade+(MODK[p.modalidade].forma&&p.forma?'|'+p.forma:''):'_'; const x=o[k]=o[k]||{k,nome:k==='_'?'Sem modalidade informada':modNome(p),t:0,concluido:0,aberto:0,cancelado:0,contratos:0}; x.t++; const s=p.situacao||'andamento'; if(s==='concluido') x.concluido++; else if(s==='cancelado') x.cancelado++; else x.aberto++; if(p.contrato) x.contratos++; }); return Object.values(o).sort((a,b)=>(a.k==='_')-(b.k==='_')||b.t-a.t); }
function rpDados(){
  const P=rpPeriodo(), r=S.rp;
  const L=lista().filter(p=>p.data&&p.data>=P.de&&p.data<=P.ate&&(!r.resp||(r.resp==='_'?!p.responsavel:p.responsavel===r.resp))&&(!r.sit||(p.situacao||'andamento')===r.sit)&&(!r.mod||(r.mod==='_'?!p.modalidade:p.modalidade===r.mod))&&(!r.sec||(r.sec==='_'?!p.secretaria:p.secretaria===r.sec)))
    .sort((a,b)=>(a.data||'').localeCompare(b.data||'')||(+a.numero||0)-(+b.numero||0));
  const k=contar(L);
  const tempos=L.filter(p=>p.situacao==='concluido'&&p.conclusao).map(p=>diasEntre(p.data,p.conclusao)).filter(n=>n!=null&&n>=0);
  const media=tempos.length?tempos.reduce((a,b)=>a+b,0)/tempos.length:null;
  const por={}; L.forEach(p=>{ const id=p.responsavel||'_'; const o=por[id]=por[id]||{id,t:0,andamento:0,aguardando:0,concluido:0,cancelado:0,tempos:[]}; o.t++; o[p.situacao||'andamento']++; if(p.situacao==='concluido'&&p.conclusao){ const d=diasEntre(p.data,p.conclusao); if(d!=null&&d>=0) o.tempos.push(d); } });
  const linhas=Object.values(por).map(o=>({...o,nome:o.id==='_'?'Sem responsável':respNome(o.id),pct:o.t?Math.round(o.concluido/(o.t-o.cancelado||1)*100):0,media:o.tempos.length?o.tempos.reduce((a,b)=>a+b,0)/o.tempos.length:null}))
    .sort((a,b)=>b.t-a.t||(a.id==='_'?1:b.id==='_'?-1:a.nome.localeCompare(b.nome,'pt-BR')));
  const hj=hoje(); const parados=lista().filter(p=>(p.situacao==='andamento'||p.situacao==='aguardando'||!p.situacao)&&p.data&&diasEntre(p.data,hj)>r.dias&&(!r.resp||(r.resp==='_'?!p.responsavel:p.responsavel===r.resp)))
    .map(p=>({...p,idade:diasEntre(p.data,hj)})).sort((a,b)=>b.idade-a.idade);
  return {P,L,k,media,linhas,parados,mods:porModalidade(L),secs:porSecretaria(L)};
}

  document.body.classList.remove('locked'); document.getElementById('loginRoot').innerHTML='';
  if(!S.mes) escolherMesInicial();
  el.innerHTML=({mes:vMes,historico:vHistorico,relatorios:vRelatorios,responsaveis:vResp,todos:vTodos,lixeira:vLixeira,config:vConfig})[route()]();
  rotular(el);
  const mon=el.querySelector('.mb-months'), on=el.querySelector('.mb-m.on'); if(mon&&on&&mon.scrollWidth>mon.clientWidth) mon.scrollLeft=on.offsetLeft-mon.offsetLeft-mon.clientWidth/2+on.clientWidth/2;
  const ch=el.querySelector('.chart'); if(ch&&ch.scrollWidth>ch.clientWidth){ const ms=mesesComDados().filter(k=>k.startsWith(S.ano+'-')); const last=ms.length?+ms[ms.length-1].slice(5):new Date().getMonth()+1; ch.scrollLeft=(ch.scrollWidth*(last/12))-ch.clientWidth*.75; }
  if(S.modal&&S.modal.kind==='proc'&&S.modal.id&&!S.proc[S.modal.id]) fechar();
  voltarFoco(foco);
}

/* ===================== Início ===================== */
render();
(async function init(){
  if(window.FIREBASE_CONFIG){ if(!window.FIREBASE_CONFIG.firebase||/COLE|SEU_/.test(JSON.stringify(window.FIREBASE_CONFIG.firebase))){ telaErroFB('Os dados do Firebase (FIREBASE_CONFIG, no início do index.html) ainda estão com os valores de exemplo.'); return; } iniciarFirebase(); return; }
  const has=window.claude&&typeof window.claude.use==='function';
  const [db,user,downloads]=has?await Promise.all([claude.use('db'),claude.use('user'),claude.use('downloads')]).catch(()=>[null,null,null]):[null,null,null];
  S.downloads=downloads; S.user=user; if(db&&has){ claude.use('assets').then(a=>{ S.assets=a; }).catch(()=>{}); }
  if(user&&db){ try{ S.me=await user.me(); S.myId=S.me.id; S.canEditConta=!!S.me.canEdit; }catch(e){} try{ S.dataWrite=await user.can('data.write'); if(S.dataWrite===false) S.canWrite=false; }catch(e){} }
  if(!db){ const L=loadLocal(); S.proc=L.processos||{}; S.resp=L.responsaveis||{}; S.config=L.config||S.config; S.mode='local'; restaurarSessao(); render(); return; }
  S.db=db; const falta=new Set(['proc','resp','acessos','perfis','config']);
  const ready=k=>{ if(falta.size){ falta.delete(k); if(!falta.size){ S.mode='db'; restaurarSessao(); } else return; } render(); };
  const sub=(col,key)=>db.collection(col).onSnapshot(snap=>{ const o={}; snap.docs.forEach(d=>o[d.id]=d.data()); S[key]=o; ready(key); },()=>{ toast('Conexão interrompida. Recarregue a página.'); ready(key); });
  sub('processos','proc'); sub('responsaveis','resp'); sub('acessos','acessos'); sub('perfis','perfis');
  db.doc('config/geral').onSnapshot(s=>{ if(s.exists) S.config={orgao:'',setor:'',...s.data()}; ready('config'); },()=>ready('config'));
  setTimeout(()=>{ if(S.mode==='loading'){ S.mode='db'; restaurarSessao(); render(); } },8000);
})();
</script>
